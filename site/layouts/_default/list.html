{{ define "main" }}<section class="page-shell"><header class="page-title"><p class="eyebrow">INDEX / {{ upper .Section }}</p><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header><div class="card-grid">{{ range .Pages }}<article class="note-card"><p class="note-meta">{{ with .Date }}{{ .Format "2006.01.02" }}{{ end }}</p><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description }}</p><a class="read" href="{{ .RelPermalink }}">Open log <span>-></span></a></article>{{ end }}</div>{{ .Content }}</section>{{ end }}
