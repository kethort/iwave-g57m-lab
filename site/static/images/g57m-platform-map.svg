<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">G57M development platform functional map</title>
  <desc id="desc">Connections for 12 volt power, J8 UART and JTAG, boot and JTAG switches, Ethernet, and the FMC connector with 1.2 volt VADJ.</desc>
  <defs><style>.bg{fill:#071014}.panel{fill:#0d191f;stroke:#2b4652;stroke-width:2}.board{fill:#102128;stroke:#57d7d0;stroke-width:3}.amber{fill:#f0a63a}.cyan{fill:#57d7d0}.white{fill:#edf4f5}.muted{fill:#8fa4ad}.line{stroke:#57d7d0;stroke-width:3;fill:none}.dash{stroke:#f0a63a;stroke-width:3;stroke-dasharray:8 8;fill:none}.title{font:700 28px sans-serif}.label{font:700 17px monospace}.small{font:14px monospace}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" class="cyan"/></marker></defs>
  <rect width="1120" height="600" class="bg"/><text x="50" y="58" class="white title">KNOWN-GOOD BENCH BASELINE</text><text x="50" y="84" class="muted small">G57M VE2302 SOM + G57D R2.0 carrier</text>
  <rect x="310" y="125" width="500" height="350" rx="18" class="board"/><rect x="450" y="195" width="220" height="150" rx="12" class="panel"/><text x="486" y="255" class="white label">G57M SOM</text><text x="486" y="285" class="muted small">Versal AI Edge</text><text x="515" y="313" class="amber label">VE2302</text>
  <rect x="330" y="155" width="92" height="55" rx="8" class="panel"/><text x="350" y="188" class="white label">J2</text><rect x="330" y="390" width="112" height="55" rx="8" class="panel"/><text x="347" y="423" class="white label">J8 USB-C</text><rect x="690" y="155" width="92" height="55" rx="8" class="panel"/><text x="705" y="188" class="white label">SW4</text><rect x="690" y="390" width="92" height="55" rx="8" class="panel"/><text x="705" y="423" class="white label">SW3</text><rect x="705" y="245" width="76" height="90" rx="8" class="panel"/><text x="716" y="282" class="white label">GEM</text><text x="716" y="309" class="white label">0 / 1</text><rect x="470" y="410" width="180" height="45" rx="8" class="panel"/><text x="504" y="439" class="white label">J20 FMC+</text>
  <rect x="35" y="135" width="215" height="95" rx="10" class="panel"/><text x="58" y="171" class="amber label">POWER</text><text x="58" y="199" class="white small">Supplied 12 V / 5 A</text><path d="M250 182H330" class="line" marker-end="url(#arrow)"/><rect x="35" y="345" width="215" height="110" rx="10" class="panel"/><text x="58" y="381" class="cyan label">HOST USB</text><text x="58" y="409" class="white small">UART 115200 8N1</text><text x="58" y="433" class="white small">Onboard JTAG</text><path d="M250 400H330" class="line" marker-end="url(#arrow)"/>
  <rect x="870" y="130" width="215" height="100" rx="10" class="panel"/><text x="893" y="166" class="amber label">BOOT MODE</text><text x="893" y="196" class="white small">Set SW4 before power</text><path d="M810 182H870" class="dash"/><rect x="870" y="365" width="215" height="100" rx="10" class="panel"/><text x="893" y="401" class="cyan label">JTAG ENABLE</text><text x="893" y="431" class="white small">SW3 = OFF</text><path d="M810 417H870" class="dash"/>
  <rect x="365" y="510" width="390" height="65" rx="10" class="panel"/><text x="390" y="539" class="amber label">FMC VADJ SWITCH = ON</text><text x="390" y="562" class="white small">Validated target rail: 1.2 V</text><path d="M560 475V510" class="line" marker-end="url(#arrow)"/>
</svg>
