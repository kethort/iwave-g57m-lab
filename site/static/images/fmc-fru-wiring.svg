<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Passive FMC breakout FRU wiring</title><desc id="desc">AT24C64 at I2C address 0x50 connected to FMC 3P3VAUX, SCL, SDA, and ground, plus grounded presence and a TDI to TDO JTAG bypass.</desc>
  <defs><style>.bg{fill:#071014}.card{fill:#0d191f;stroke:#2b4652;stroke-width:2}.chip{fill:#13272f;stroke:#f0a63a;stroke-width:3}.white{fill:#edf4f5}.muted{fill:#8fa4ad}.amber{fill:#f0a63a}.cyan{fill:#57d7d0}.green{fill:#7ee2a8}.wire{stroke:#57d7d0;stroke-width:4;fill:none}.power{stroke:#f0a63a;stroke-width:4;fill:none}.ground{stroke:#8fa4ad;stroke-width:4;fill:none}.bypass{stroke:#7ee2a8;stroke-width:5;fill:none}.title{font:700 28px sans-serif}.label{font:700 17px monospace}.small{font:14px monospace}.pin{font:600 15px monospace}</style></defs>
  <rect width="1120" height="690" class="bg"/><text x="48" y="58" class="white title">PASSIVE FMC LPC BREAKOUT</text><text x="48" y="84" class="muted small">FRU identity + presence + scan-chain continuity</text><rect x="42" y="118" width="1036" height="525" rx="18" class="card"/>
  <text x="80" y="165" class="cyan label">FMC J20 SIGNALS</text><text x="90" y="230" class="white pin">D32  3P3VAUX</text><text x="90" y="300" class="white pin">C30  I2C SCL</text><text x="90" y="370" class="white pin">C31  I2C SDA</text><text x="90" y="440" class="white pin">H3   GND</text>
  <rect x="490" y="190" width="300" height="285" rx="12" class="chip"/><text x="570" y="235" class="amber label">AT24C64</text><text x="582" y="263" class="muted small">I2C address 0x50</text><text x="510" y="304" class="white pin">VCC</text><text x="714" y="304" class="white pin">SCL</text><text x="510" y="372" class="white pin">GND</text><text x="714" y="372" class="white pin">SDA</text><text x="550" y="430" class="muted pin">A0 A1 A2 WP</text>
  <path d="M235 225H430V295H490" class="power"/><path d="M235 295H700V295H790" class="wire"/><path d="M235 365H700V365H790" class="wire"/><path d="M235 435H460V365H490" class="ground"/><path d="M640 430V505H350V435" class="ground"/><text x="820" y="304" class="amber small">3.3 V AUX</text><text x="820" y="372" class="cyan small">two-byte offset</text><text x="820" y="432" class="muted small">A0/A1/A2/WP grounded</text>
  <line x1="65" y1="535" x2="1055" y2="535" stroke="#2b4652" stroke-width="2"/><text x="82" y="579" class="white pin">H2 PRSNT_M2C_L</text><path d="M270 573H450" class="ground"/><text x="470" y="579" class="muted small">GND: mezzanine present</text><text x="82" y="617" class="white pin">D30 TDI</text><path d="M195 611H395" class="bypass"/><text x="415" y="617" class="green label">D31 TDO</text><text x="580" y="617" class="muted small">passive JTAG bypass</text>
</svg>
