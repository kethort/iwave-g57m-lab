<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">FMC bring-up evidence chain</title><desc id="desc">Five validation stages from an EEPROM response through FRU parsing and JTAG continuity to VADJ selection and PMIC rail configuration.</desc>
  <defs><style>.bg{fill:#071014}.box{fill:#0d191f;stroke:#2b4652;stroke-width:2}.pass{fill:#102b24;stroke:#70dfa3;stroke-width:2}.white{fill:#edf4f5}.muted{fill:#8fa4ad}.amber{fill:#f0a63a}.green{fill:#70dfa3}.line{stroke:#57d7d0;stroke-width:3;fill:none}.title{font:700 27px sans-serif}.label{font:700 15px monospace}.small{font:13px monospace}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#57d7d0"/></marker></defs>
  <rect width="1120" height="410" class="bg"/><text x="48" y="58" class="white title">DO NOT STOP AT "IT POWERS ON"</text><text x="48" y="84" class="muted small">A useful baseline leaves evidence at every boundary.</text>
  <g transform="translate(42 140)"><rect width="175" height="130" rx="10" class="box"/><text x="20" y="35" class="amber label">01 / I2C</text><text x="20" y="72" class="white label">ACK at 0x50</text><text x="20" y="99" class="muted small">offset length = 2</text></g><path d="M220 205H255" class="line" marker-end="url(#a)"/>
  <g transform="translate(260 140)"><rect width="175" height="130" rx="10" class="box"/><text x="20" y="35" class="amber label">02 / FRU</text><text x="20" y="72" class="white label">Record parses</text><text x="20" y="99" class="muted small">identity + VADJ</text></g><path d="M438 205H473" class="line" marker-end="url(#a)"/>
  <g transform="translate(478 140)"><rect width="175" height="130" rx="10" class="box"/><text x="20" y="35" class="amber label">03 / JTAG</text><text x="20" y="72" class="white label">Chain scans</text><text x="20" y="99" class="muted small">TDI -&gt; TDO bypass</text></g><path d="M656 205H691" class="line" marker-end="url(#a)"/>
  <g transform="translate(696 140)"><rect width="175" height="130" rx="10" class="box"/><text x="20" y="35" class="amber label">04 / VADJ</text><text x="20" y="72" class="white label">1.2 V selected</text><text x="20" y="99" class="muted small">FMC powered</text></g><path d="M874 205H909" class="line" marker-end="url(#a)"/>
  <g transform="translate(914 130)"><rect width="165" height="150" rx="10" class="pass"/><text x="20" y="35" class="green label">05 / PASS</text><text x="20" y="72" class="white label">702: 1.2 V</text><text x="20" y="98" class="white label">703: 1.2 V</text><text x="20" y="124" class="white label">302: 1.8 V</text></g><text x="48" y="350" class="muted small">If one stage fails, debug that boundary before moving downstream.</text>
</svg>
